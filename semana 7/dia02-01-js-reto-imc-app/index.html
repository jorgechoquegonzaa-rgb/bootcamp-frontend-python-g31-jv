<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Calculadora IMC</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background-color: #101318;
        min-height: 100vh;
        margin: 0;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      /* Tarjeta principal */
      .card {
        width: 480px;
        max-width: 90%;

        background-color: #ffffff;

        border: 1px solid #dddddd;
        border-radius: 8px;

        padding: 20px;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }

      /* Título */
      h1 {
        margin: 0 0 25px 0;

        text-align: center;

        font-size: 24px;
        font-weight: 400;

        color: #333333;
      }

      /* Etiquetas */
      label {
        display: block;

        margin-bottom: 8px;

        color: #555555;

        font-size: 16px;
      }

      /* Campos de texto */
      input {
        width: 100%;

        padding: 16px;

        border: 1px solid #dddddd;
        border-radius: 8px;

        background-color: #ffffff;

        font-size: 16px;
        color: #333333;

        outline: none;
      }

      input::placeholder {
        color: #999999;
      }

      input:focus {
        border-color: #198754;

        box-shadow: 0 0 0 2px rgba(25, 135, 84, 0.15);
      }

      /* Espacio entre campos */
      .campo {
        margin-bottom: 20px;
      }

      /* Botón */
      .btn-calculate {
        width: 100%;

        padding: 14px;

        border: none;
        border-radius: 8px;

        background-color: #198754;
        color: white;

        font-size: 18px;
        font-weight: 500;

        cursor: pointer;

        transition: background-color 0.2s;
      }

      .btn-calculate:hover {
        background-color: #157347;
      }

      /* Caja del resultado */
      .result-box {
        margin-top: 20px;

        padding: 20px;

        border-radius: 8px;

        background-color: #fff3cd;

        border: 1px solid #ffecb5;

        text-align: center;

        color: #664d03;
      }

      /* Resultado oculto */
      .result-box.hidden {
        display: none;
      }

      /* Texto del resultado */
      .imc-message {
        font-size: 18px;
        font-weight: 500;
      }

      .imc-value {
        margin-top: 10px;

        font-size: 28px;
        font-weight: bold;
      }

      .imc-detalle {
        margin-top: 5px;

        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div class="card">

      <h1>Indice de masa corporal</h1>

      <form id="imcForm">

        <!-- Peso -->
        <div class="campo">
          <label for="peso">Peso (KG)</label>

          <input
            type="number"
            id="peso"
            placeholder="Ej. 50"
            min="1"
            max="300"
            step="0.1"
            required
          />
        </div>

        <!-- Altura -->
        <div class="campo">
          <label for="altura">Altura (CM)</label>

          <input
            type="number"
            id="altura"
            placeholder="Ej. 170"
            min="50"
            max="250"
            step="0.1"
            required
          />
        </div>

        <!-- Botón -->
        <button type="submit" class="btn-calculate">
          Calcular
        </button>

      </form>

      <!-- Resultado -->
      <div id="resultadoContainer" class="result-box hidden">

        <div id="imcMensaje" class="imc-message">
          Tu Índice de Masa Corporal es NORMAL
        </div>

        <div id="imcValor" class="imc-value"></div>

        <div id="imcDetalle" class="imc-detalle"></div>

      </div>

    </div>

    <!-- JavaScript -->
    <script src="main.js"></script>

  </body>
</html>
