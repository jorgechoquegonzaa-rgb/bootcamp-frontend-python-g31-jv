<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi portafolio-Jorge Bonifacio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header wrapper">
      <span class="header__logo">{vv}</span>

      <nav class="header__menu">
        <a href="" class="header__menu--active">acerca de mí</a>
        <a href="">habilidades</a>
        <a href="">portafolio</a>
      </nav>

      <div class="header__links">
        <img
          src=" https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/github.svg"
          alt="Github"
        />
        <img
          src=" https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/linkedin.svg"
          alt="Linkedin"
        />
      </div>
    </header>

    <main>
      <section class="hero">
        <h2 class="hero__gretting">Hola, Soy Jorge Bonifacio 💪</h2>
        <h1 class="hero__title">Desarrollador web full-stack</h1>
        <p class="hero__description">
          Desarrollador especializado en Javascript, React.js, Vue, Python y
          Node.js.
        </p>

        <img
          class="hero__photo"
          src="https://placehold.co/278x278"
          alt="Victor Villazón Desarrollador web full-stack"
        />
      </section>
    </main>
  </body>
</html>
